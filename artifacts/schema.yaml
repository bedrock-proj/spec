$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/artifact
title: Bedrock generated artifact definition
type: object
required: [generator, outputs]
additionalProperties: true
properties:
  summary:
    type: string
    minLength: 1
  generator:
    $ref: '#/$defs/generator-path'
  inputs:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/id'
  depends-on:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/id'
  source:
    $ref: '#/$defs/relative-path'
  outputs:
    type: object
    minProperties: 1
    propertyNames:
      $ref: '#/$defs/id'
    additionalProperties:
      $ref: '#/$defs/relative-path'
  derived-outputs:
    type: object
    minProperties: 1
    propertyNames:
      $ref: '#/$defs/id'
    additionalProperties:
      $ref: '#/$defs/relative-path'
allOf:
- not:
    anyOf:
    - required: [id]
    - required: [output]
    - required: [dependency-graph]
    - required: [status]
$defs:
  id:
    type: string
    pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
  relative-path:
    type: string
    pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$
  generator-path:
    allOf:
    - $ref: '#/$defs/relative-path'
    - pattern: \.py$
x-interpretation-rules:
- The artifact directory name is the artifact ID and owns one artifact.yaml.
- An artifact directory may own its generator implementation.
- Every declared artifact names a local generator.py entrypoint and is directly generatable.
- Outputs are the role-to-root mapping populated by the artifact's pure generator.
- Derived outputs are artifact-owned validation or compilation results produced from the primary outputs. They share the artifact's owner and are visible to global output-collision validation.
- An output root may name one generated file or a closed generated tree, and every emitted file belongs to exactly one root.
- Inputs name workspace domain providers, while depends-on names generated artifacts.
- Artifact-local generators validate their configuration and are pure projections.
- Only write_artifacts() mutates output trees.
