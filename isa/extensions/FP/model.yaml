sail:
  instruction_set: FpuSet
  fault_kinds: [FloatingPointFault]
  effect_kinds: [FloatingPointCompute]
  units:
  - id: contract
    requires:
    - base.decode-types
    - base.decode
    sources:
    - semantics/operation_catalog.sail
    - semantics/approximation_contract.sail
    - semantics/register_pairs.sail
    - semantics/types.sail
    - semantics/environment.sail
    - semantics/primitives/arithmetic.sail
    - semantics/primitives/comparison.sail
    - semantics/primitives/conversion.sail
    - semantics/primitives/data.sail
    - semantics/local_operations.sail
    - semantics/primitives.sail
    - semantics/request_contract.sail
    - semantics/response_contract.sail
    - semantics/finalize.sail
  - id: execution
    requires:
    - base.architectural-types
    - base.decode-types
    - base.decode
    - FP.contract
    - base.runtime
    sources:
    - semantics/register_access.sail
    - semantics/transaction_inputs.sail
    - semantics/uops/fp_compute.sail
    - semantics/uops/fp_state.sail
    - semantics/uops/lowering.sail
    - semantics/state_records.sail
