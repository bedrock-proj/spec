$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/instruction-metasyntax
title: Bedrock instruction metasyntax
type: string
minLength: 1
x-ebnf: |
  instruction = instruction_head, [" ", operand_list] ;
  instruction_head = MNEMONIC, [size_suffix], [order_selector] ;

  size_suffix = fixed_size_suffix | selected_size_suffix ;
  fixed_size_suffix = ".", IDENTIFIER ;
  selected_size_suffix = ".{", IDENTIFIER, {"|", IDENTIFIER}, "}", field_expression ;
  order_selector = "/order", field_expression ;

  operand_list = operand, {", ", operand} ;
  operand = address
          | braced_group
          | parenthesized_group
          | DECIMAL
          | operand_reference, [field_expression] ;

  operand_reference = IDENTIFIER | "<", IDENTIFIER, ">" ;
  field_expression = "(", FIELD_MARKER, ")" ;

  braced_group = "{ ", operand_reference, "... }" ;
  parenthesized_group = "(", operand_reference, ")" ;

  address = "[", address_expression, "]" ;
  address_expression = {ADDRESS_WHITESPACE
                      | address
                      | "+"
                      | "*"
                      | DECIMAL
                      | operand_reference, [field_expression]} ;
x-lexer:
  MNEMONIC: '[A-Za-z][A-Za-z0-9]*'
  IDENTIFIER: '[A-Za-z][A-Za-z0-9_]*'
  FIELD_MARKER: '[a-z]'
  DECIMAL: '[0-9]+'
  ADDRESS_WHITESPACE: '\s+'
x-interpretation-rules:
  - All terminals and lexer tokens are case-sensitive.
  - Outside an address expression, whitespace is significant: one space separates the instruction head from its first operand, and comma followed by one space separates operands.
  - Whitespace may occur only where ADDRESS_WHITESPACE appears inside an address expression.
  - A selected size suffix contains one or more distinct public size suffix identifiers and binds them to the following field expression.
  - An order selector binds the memory-order field independently of whether a size suffix is fixed, selected, or absent.
  - A field expression contains exactly one lowercase field marker.
  - Angle brackets are part of an operand reference and must be paired.
  - A nested address inside an address expression denotes lane indexing; plus and asterisk are the only address operators.
  - The braced group spelling includes the spaces in "{ " and "... }"; the parenthesized group contains only one operand reference.
