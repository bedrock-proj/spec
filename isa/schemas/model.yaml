$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/model
title: Bedrock owner-local Sail and document manifest
type: object
additionalProperties: false
anyOf:
- required: [sail]
- required: [documents]
properties:
  sail:
    type: object
    additionalProperties: false
    required: [units]
    properties:
      instruction_set:
        type: string
        pattern: ^[A-Z][A-Za-z0-9]*$
      fault_kinds:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[A-Z][A-Za-z0-9]*$
      effect_kinds:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[A-Z][A-Za-z0-9]*$
      units:
        type: array
        items:
          $ref: '#/$defs/sail-unit'
      execution_provider:
        allOf:
        - $ref: '#/$defs/owner-source'
        - pattern: \.sail$
  documents:
    type: object
    additionalProperties: false
    required: [topics]
    properties:
      topics:
        type: array
        items:
          $ref: '#/$defs/document-topic'
$defs:
  id:
    type: string
    pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
  owner-source:
    type: string
    pattern: ^(?:[A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+$
  sail-unit:
    type: object
    additionalProperties: false
    required: [id, sources]
    properties:
      id:
        $ref: '#/$defs/id'
      sources:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          allOf:
          - $ref: '#/$defs/owner-source'
          - pattern: \.sail$
      requires:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^(?:base|[A-Z][A-Z0-9_]*)\.[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
  document-topic:
    type: object
    additionalProperties: false
    required: [id, source]
    properties:
      id:
        $ref: '#/$defs/id'
      source:
        allOf:
        - $ref: '#/$defs/owner-source'
        - pattern: \.tex$
x-interpretation-rules:
- model.yaml is owned by the directory containing it and contains two independent catalogs.
- Every declared base or extension namespace has a model.yaml; absence is an error rather than an empty namespace.
- sail.units are executable dependency nodes; each owns one or more ordered Sail sources.
- sail.instruction_set optionally declares the Sail Instruction_set constructor owned by an extension namespace.
- sail.fault_kinds declares Fault_kind constructors contributed by the owner to selected executable models.
- sail.effect_kinds declares Effect_kind constructors contributed by the owner to selected executable models.
- sail.execution_provider is an optional owner-local Sail source that implements the final execute_operation_entry, cpuid_flag_enabled, and event_from_fault boundaries after generated instruction dispatch.
- A selected configuration has at most one execution provider; without one, generated adapters implement all three boundaries directly from the base semantics.
- documents.topics are owner-local TeX sources; each file owns one available subtopic.
- Every document topic source contains exactly one sectioning command and is included without generated splitting.
- Reader-facing artifacts select and order topics explicitly in their own compositions.
- Sail units and document topics have no cardinality or colocated-file constraint.
- Base sources must remain outside extensions, and extension sources must remain below their owning extension root.
- Sail unit dependencies form one explicit project graph across base and extension namespaces.
