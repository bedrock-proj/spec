encodings:
  q_8_sp:
    pattern: '0001111'
    syntax: SUB.Q 8, SP
    fixed_operand_roles: [imm, dst]
  l_q_z_rn_s_rn_d:
    pattern: 00010zssssdddd
    syntax: SUB.{L|Q}(z) Rn(s), Rn(d)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_LQ
      s:
        role: src
        type: base.field_types.Rn
      d:
        role: dst
        type: base.field_types.Rn
  q_imm8_i_sp:
    pattern: 100101iiiiiiii
    syntax: SUB.Q imm8(i), SP
    fixed_operand_roles: [dst]
    fields:
      i:
        role: imm
        type: base.field_types.IMM8
    constraints:
    - role: imm
      allow:
      - 0x1..0xff
      reason: zero_immediate_reclaimed
  q_imm16s_sp:
    pattern: '111011110000001000'
    syntax: SUB.Q <imm16s>, SP
    fixed_operand_roles: [dst]
    payloads:
    - role: imm
      type: base.payload_types.IMM16S
  q_imm32s_sp:
    pattern: '111011110000001001'
    syntax: SUB.Q <imm32s>, SP
    fixed_operand_roles: [dst]
    payloads:
    - role: imm
      type: base.payload_types.IMM32S
  b_w_l_q_z_rn_s_ea_e:
    pattern: 00010zzsssseeeeeee
    syntax: SUB.{B|W|L|Q}(z) Rn(s), <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      s:
        role: src
        type: base.field_types.Rn
      e:
        role: dst
        type: base.field_types.EA
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  b_w_l_q_z_ea_e_rn_d:
    pattern: 01010zzddddeeeeeee
    syntax: SUB.{B|W|L|Q}(z) <ea>(e), Rn(d)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      d:
        role: dst
        type: base.field_types.Rn
      e:
        role: src
        type: base.field_types.EA
  b_w_l_q_z_imm8s_ea_e:
    pattern: 11110110000000001zzeeeeeee
    syntax: SUB.{B|W|L|Q}(z) <imm8s>, <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM8S
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  w_l_q_z_imm16s_ea_e:
    pattern: 11110110000000010zzeeeeeee
    syntax: SUB.{W|L|Q}(z) <imm16s>, <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_WLQ
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM16S
    constraints:
    - role: size
      allow:
      - 0x1..0x3
      reason: immediate_wider_than_operation_size
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  l_q_z_imm32s_ea_e:
    pattern: 111101100000000110zeeeeeee
    syntax: SUB.{L|Q}(z) <imm32s>, <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_LQ
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM32S
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  q_imm64_ea_e:
    pattern: 11101001111eeeeeee
    syntax: SUB.Q <imm64>, <ea>(e)
    fields:
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM64
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
