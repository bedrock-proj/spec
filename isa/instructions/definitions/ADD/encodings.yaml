encodings:
  q_8_sp:
    pattern: '0001110'
    syntax: ADD.Q 8, SP
    fixed_operand_roles: [imm, dst]
  l_q_z_rn_s_rn_d:
    pattern: 00001zssssdddd
    syntax: ADD.{L|Q}(z) Rn(s), Rn(d)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_LQ
      s:
        role: src
        type: base.field_types.Rn
      d:
        role: dst
        type: base.field_types.Rn
  q_imm8_i_sp:
    pattern: 100011iiiiiiii
    syntax: ADD.Q imm8(i), SP
    fixed_operand_roles: [dst]
    fields:
      i:
        role: imm
        type: base.field_types.IMM8
  q_imm16s_sp:
    pattern: '111011110000000000'
    syntax: ADD.Q <imm16s>, SP
    fixed_operand_roles: [dst]
    payloads:
    - role: imm
      type: base.payload_types.IMM16S
  q_imm32s_sp:
    pattern: '111011110000000001'
    syntax: ADD.Q <imm32s>, SP
    fixed_operand_roles: [dst]
    payloads:
    - role: imm
      type: base.payload_types.IMM32S
  b_w_l_q_z_rn_s_ea_e:
    pattern: 00001zzsssseeeeeee
    syntax: ADD.{B|W|L|Q}(z) Rn(s), <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      s:
        role: src
        type: base.field_types.Rn
      e:
        role: dst
        type: base.field_types.EA
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  b_w_l_q_z_ea_e_rn_d:
    pattern: 01001zzddddeeeeeee
    syntax: ADD.{B|W|L|Q}(z) <ea>(e), Rn(d)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      d:
        role: dst
        type: base.field_types.Rn
      e:
        role: src
        type: base.field_types.EA
  b_w_l_q_z_imm8s_ea_e:
    pattern: 11100zz0001eeeeeee
    syntax: ADD.{B|W|L|Q}(z) <imm8s>, <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM8S
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  w_l_q_z_imm16s_ea_e:
    pattern: 11100zz0010eeeeeee
    syntax: ADD.{W|L|Q}(z) <imm16s>, <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_WLQ
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM16S
    constraints:
    - role: size
      allow:
      - 0x1..0x3
      reason: immediate_wider_than_operation_size
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  l_q_z_imm32s_ea_e:
    pattern: 111001z0011eeeeeee
    syntax: ADD.{L|Q}(z) <imm32s>, <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_LQ
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM32S
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  q_imm64_ea_e:
    pattern: 11101000000eeeeeee
    syntax: ADD.Q <imm64>, <ea>(e)
    fields:
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM64
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
